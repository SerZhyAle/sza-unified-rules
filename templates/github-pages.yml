name: Site
run-name: Publish site/ to GitHub Pages

# Copy to .github/workflows/pages.yml. site/ holds the hand-authored pages and, where the product has one, a landing
# rendered from sources by a script and committed. This workflow publishes site/ as it is, and refuses to unless the
# rendered pages equal their sources. The check runs on Windows, where the renderer is measured; the deploy runs on Linux.
# A site with nothing rendered drops the check job and the `needs: check` line below.
# Enable Pages once with the workflow build type:
#   gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: windows-latest
    steps:
      # The pages and their sources are LF in the repository and the check compares bytes; the Windows runner's default
      # core.autocrlf=true would turn them into CRLF on checkout. This step stays first, before actions/checkout.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Rendered pages equal their sources
        shell: pwsh
        # Replace with the repository's own byte-exact site check.
        run: |
          pwsh -NoProfile -File tools/site/render-landing.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
